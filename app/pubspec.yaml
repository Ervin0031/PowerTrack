name: app_flutter
description: "PowerTrack Flutter App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Network
  dio: ^5.8.0+1

  # Local database
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_cache_manager: ^3.4.1

  # Code Generation

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.5
  pretty_dio_clean_logger: ^1.0.2
  m3e_core: ^1.1.2
  material_ui: ^1.1.0
  material_symbols_icons: ^4.2960.0
  figma_squircle: ^0.6.3
  motor: ^1.1.0
  intl: ^0.20.2
  package_info_plus: ^8.3.0
  # 本地 Material 3 表达式组件包
  expressive_snack:
    path: packages/expressive_snack
  cached_network_image: ^3.4.1
  heroine: ^0.7.2
  fl_chart: ^1.2.0
  flutter_muscle_anatomy: ^1.2.8
  path_drawing: ^1.0.1
  image_picker: ^1.1.2
  live_activities: ^2.6.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_secure_storage: ^10.3.4
  gpt_markdown: ^1.3.4
  speech_to_text: ^7.5.0
  openai_dart: ^11.0.1
  flutter_native_splash: ^2.4.8
  phosphoricons_flutter: ^1.1.1
  paged_vertical_calendar: ^1.1.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2
  flutter_secure_storage_platform_interface: ^2.1.1

# build_runner 工具链兼容性锁：
# - riverpod_generator → riverpod_analyzer_utils → custom_lint_core 依赖 analyzer_plugin ^0.12.0，
#   而 analyzer_plugin 0.12.0 只兼容 analyzer ≤7.2.x（7.3+ 引入 Element2 API 迁移导致无法编译）。
# - analyzer ≤7.2.x 又需要 SDK 内置的 `_macros`（当前 Dart 3.12.2 未提供），故不能下调 analyzer。
# - 方案：把 analyzer_plugin 覆盖到 0.13.1（适配 analyzer ^7.4.5，即当前 7.6.0 可编译）。
#   若升级依赖链到支持 analyzer_plugin ≥0.13 的版本后，可移除本段。
dependency_overrides:
  analyzer_plugin: 0.13.1

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo/logo_light.png
  color_dark: "#121212"
  image_dark: assets/images/logo/logo_dark.png

  android_12:
    image: assets/images/logo/logo_light.png
    icon_background_color: "#ffffff"
    image_dark: assets/images/logo/logo_dark.png
    icon_background_color_dark: "#121212"

flutter:
  uses-material-design: true
  assets:
  - assets/images/logo/

  fonts:
  - family: GoogleSansFlex
    fonts:
    - asset: assets/fonts/Google_Sans_Flex/GoogleSansFlex-VariableFont_GRAD,ROND,opsz,slnt,wdth,wght.ttf
