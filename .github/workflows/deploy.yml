name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            cd /opt/PowerTrackV2
            git pull origin main
            cd backend

            # 只改代码 → 重启即可（volume mount 生效）
            # 改 Dockerfile/pyproject.toml/uv.lock → 需要 --build
            if git diff --name-only HEAD~1 | grep -qE 'Dockerfile|pyproject\.toml|uv\.lock'; then
              echo "依赖变更，重新构建镜像..."
              docker compose up -d --build
            else
              echo "仅代码变更，重启服务..."
              docker compose up -d --force-recreate
            fi

            docker compose ps
