services:
  rustfs-perms:
    image: alpine:latest
    container_name: backend_rustfs_perms
    command: chmod -R 777 /data
    volumes:
      - rustfs_data:/data
    restart: "no"
    networks:
      - app-network

  rustfs:
    image: rustfs/rustfs:latest
    container_name: backend_rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    env_file:
      - ./secret/.env.production
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}
      - RUSTFS_CONSOLE_ENABLE=true
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - ./secret/.env.production
    environment:
      - ENV=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/power_track
      - REDIS_CONNECTION_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./app:/app/app
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    container_name: backend_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=power_track
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      timeout: 20s
      retries: 10

  db-migrate:
    build: .
    container_name: backend_db_migrate
    command: alembic upgrade head
    env_file:
      - ./secret/.env.production
    environment:
      - ENV=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/power_track
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: backend_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - app-network

  celery-worker:
    build: .
    container_name: backend_celery_worker
    command: celery -A app.core.celery.celery_app worker --loglevel=info
    env_file:
      - ./secret/.env.production
    environment:
      - ENV=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/power_track
      - REDIS_CONNECTION_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./app:/app/app
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  celery-beat:
    build: .
    container_name: backend_celery_beat
    command: celery -A app.core.celery.celery_app beat --loglevel=info
    env_file:
      - ./secret/.env.production
    environment:
      - ENV=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/power_track
      - REDIS_CONNECTION_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./app:/app/app
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  rustfs_data:

networks:
  app-network:
    driver: bridge
